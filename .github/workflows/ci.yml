name: WikiMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python modules
        run: python -m compileall -q backend data_pipeline evaluation frontend
      - name: Run Ruff
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .
      - name: Validate dashboard JavaScript
        shell: bash
        run: find dashboard -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run regression tests
        run: pytest
