[project]
name = "wikimind"
version = "0.1.0"
description = "WikiMind: Production-Grade Hybrid Agentic RAG Pipeline trained on the complete English Wikipedia dataset. Combines Dense Vector, Sparse BM25, and Vectorless PageIndex retrieval with LangGraph CRAG/Self-RAG orchestration."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11,<3.14"
dependencies = [
    # LLM Framework and Orchestration
    "langchain>=0.3.0,<2",
    "langchain-community>=0.3.0,<1",
    "langchain-openai>=0.3.0,<2",
    "langchain-text-splitters>=0.3.0,<2",
    "langgraph>=0.4.0,<2",
    # Web Framework
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.34.0,<1",
    "sse-starlette>=2.0.0,<4",
    "pydantic-settings>=2.7.0,<3",
    # Vector Database and Embeddings
    "qdrant-client[fastembed]>=1.18.0,<2",
    "fastembed>=0.8.0,<1",
    # Caching
    "redisvl>=0.4.0,<1",
    "redis>=5.0.0,<8",
    # Observability and Guardrails
    "langfuse>=4.10.0,<5",
    "nemoguardrails>=0.22.0,<1",
    "prometheus-fastapi-instrumentator>=7.0.0,<9",
    # Retrieval
    "rank_bm25>=0.2.2,<1",
    "flashrank>=0.2.0,<1",
    # Data Pipeline
    "datasets>=3.0.0,<6",
    "aiohttp>=3.11.0,<4",
    # Knowledge Graph (Phase 4)
    "spacy>=3.7.0,<4",
    "networkx>=3.0,<4",
    # Utilities
    "python-dotenv>=1.2.2,<2",
    "httpx>=0.28.0,<1",
    "streamlit>=1.58.0,<2",
    "requests>=2.34.2,<3",
    "sseclient-py>=1.9.0,<2",
]

[project.optional-dependencies]
tavily = ["tavily-python>=0.5.0"]
eval = ["pandas", "tabulate"]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6,<1",
]

[project.urls]
Repository = "https://github.com/JayacharanR/WikiMind-End-to-End-Hybrid-RAG-Pipeline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend", "data_pipeline", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

