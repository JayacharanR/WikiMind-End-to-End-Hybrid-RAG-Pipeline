<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WikiMind RAG Interface</title>
    <link rel="stylesheet" href="style.css">
    <!-- Feather Icons for minimalist SVG icons without emojis -->
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Google Fonts for curvy brand text -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="top-nav">
        <button class="home-btn top-home" onclick="location.reload()" title="Home">W</button>
        <button id="sidebarToggle" class="sidebar-toggle-btn" title="Toggle Sidebar">
            <i data-feather="sidebar"></i>
        </button>
        <button class="icon-btn top-new-chat-btn" onclick="location.reload()" title="New Chat">
            <i data-feather="plus"></i>
        </button>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <!-- Removed box logo icon as requested -->
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-item active" onclick="location.reload()">
                <i data-feather="edit-3"></i> New chat
            </a>
            
            <div style="font-size: 0.75rem; color: #555; text-transform: uppercase; margin-top: 2rem; margin-bottom: 0.25rem; padding-left: 0.5rem; letter-spacing: 0.05em; font-weight: 600;">Coming Soon</div>
            <a href="#" class="nav-item" style="opacity: 0.5; cursor: default;" onclick="return false;">
                <i data-feather="activity"></i> Observability
            </a>
            <a href="#" class="nav-item" style="opacity: 0.5; cursor: default;" onclick="return false;">
                <i data-feather="shield"></i> Guardrails
            </a>
        </nav>
        
        <div class="dropdown-container" style="margin-top: auto;">
            <a href="#" class="nav-item" id="settingsBtn">
                <i data-feather="settings"></i> Query Transformation
                <i data-feather="chevron-down" class="dropdown-arrow" id="dropdownArrow"></i>
            </a>
            <div class="dropdown-content" id="settingsDropdown">
                <div class="setting-item">
                    <label>Multi-Query</label>
                    <input type="checkbox" id="toggleMultiQuery">
                </div>
                <div class="setting-item">
                    <label>HyDE</label>
                    <input type="checkbox" id="toggleHyde">
                </div>
                <div class="setting-item">
                    <label>Step-Back</label>
                    <input type="checkbox" id="toggleStepBack">
                </div>
                <div class="setting-item">
                    <label>Decomposition</label>
                    <input type="checkbox" id="toggleDecomposition">
                </div>
                <div class="setting-item">
                    <label>Time-Travel</label>
                    <input type="checkbox" id="toggleTimeTravel">
                </div>
                <div class="setting-item" id="datePickerContainer" style="display: none;">
                    <label>As of Date</label>
                    <input type="date" id="asOfDate" style="background:#222; color:#fff; border:none; padding:4px; border-radius:4px;">
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container">
        
        <div class="chat-history" id="chatHistory">
            <!-- Empty state centered message -->
            <div class="empty-state" id="emptyState">
                <h1>Welcome to <span class="brand-text">WikiMind</span></h1>
                <p>Ask Wikipedia something complex to get started...</p>
            </div>
            <!-- Chat bubbles will be injected here via JS -->
        </div>

        <!-- Input Area -->
        <div class="input-container centered" id="inputContainer">
            <div class="input-box">
                <button class="home-btn input-home" onclick="location.reload()" title="New Chat">W</button>
                <textarea id="chatInput" placeholder="Type a message..." rows="1"></textarea>
                <div class="input-controls">
                    <button class="icon-btn submit-btn" id="sendBtn">
                        <i data-feather="arrow-up"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>



    <!-- Load custom logic -->
    <script src="script.js?v=9"></script>
    <script>
        // Initialize feather icons
        feather.replace();
    </script>
</body>
</html>
